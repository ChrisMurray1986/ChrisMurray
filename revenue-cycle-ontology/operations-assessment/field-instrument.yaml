        signals: '"We schedule it and sort it out later"; ordering-office callbacks post-service; unsigned orders
          found at coding'
        degrades:
        - orders_digitized
        protocol:
          ask: ROLE-SCHED + supervisor
          artifact: walk 10 sampled accounts through this process; request the report/log named in the signals
