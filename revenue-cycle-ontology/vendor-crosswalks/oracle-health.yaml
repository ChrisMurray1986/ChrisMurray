# Oracle Health (Cerner Millennium) crosswalk — native capability bindings.
# Schema: README.md in this directory. Neutral layer governs; as_of is load-bearing.
# Confidence runs lower than the Epic file by design: Millennium revenue-cycle packaging
# (Millennium Patient Accounting → RevElate transition, Oracle Health rebranding) is in
# active motion — treat medium/needs-sme entries as structured hypotheses to confirm on site.

meta:
  vendor: "Oracle Health (Cerner Millennium)"
  as_of: "2026-07"
  archetype: "Millennium operational (PowerChart, Registration/Scheduling, SurgiNet, PharmNet);
    RevElate / Millennium Patient Accounting billing; Discern Expert rules + CCL; Oracle Health
    data platforms (HealtheIntent-lineage / Data Intelligence) for analytics; clearinghouse for EDI"
  confidence_legend:
    high: "Stable, widely deployed module behavior"
    medium: "Real capability; packaging/licensing/naming churns — verify current product scope"
    needs-sme-validation: "Structured hypothesis; confirm with certified analyst on site"

