# Value drivers — machine-readable implementation of 09-value-model.md.
# Consumed by value.py with an org profile (financial inputs) and optionally
# the feasibility assessment (dispositions gate the ramp).
#
# pools: shared, finite value pools. `formula` documents sizing (computed in
#   value.py from the org profile). `stream` maps to the VS-* taxonomy.
#   `type: annual` pools are drawn by share; the `ar_days` pool is `type: days`
#   (draws are AR-days reduced; one-time release and recurring carrying cost
#   are computed separately).
#
# use_cases: per-UC steady-state draws. share = fraction of the pool captured
#   at full maturity (base case). Engine applies global low/high multipliers
#   unless a draw carries explicit low:/high:. Calibrate shares to your own
#   data over time (quarterly true-up, 09-value-model.md §4).

pools:
  denial_prevention:  {stream: VS-1, type: annual, formula: "npr * denial_writeoff_pct * denial_preventable_share"}
  denial_recovery:    {stream: VS-2, type: annual, formula: "npr * denial_writeoff_pct * (1 - denial_preventable_share) * denial_recovery_headroom"}
  underpayment:       {stream: VS-2, type: annual, formula: "npr * underpayment_pct * underpayment_detectable"}
  charge_capture:     {stream: VS-3, type: annual, formula: "npr * charge_leakage_pct"}
  doc_yield:          {stream: VS-3, type: annual, formula: "npr * doc_yield_pct"}
  coverage_conversion: {stream: VS-3, type: annual, formula: "npr * coverage_convertible_pct"}
  contract_yield:     {stream: VS-3, type: annual, formula: "npr * contract_yield_pct"}
  pos_yield:          {stream: VS-4, type: annual, formula: "npr * pos_upside_pct"}
  bad_debt_reduction: {stream: VS-4, type: annual, formula: "npr * bad_debt_pct * bad_debt_addressable"}
  ar_days:            {stream: VS-5, type: days,   formula: "per day: one-time npr/365, recurring npr/365 * wacc; cap max_reducible_days"}
  labor_access:       {stream: VS-6, type: annual, formula: "labor_total * share.access"}
  labor_um_cdi:       {stream: VS-6, type: annual, formula: "labor_total * share.um_cdi"}
  labor_coding:       {stream: VS-6, type: annual, formula: "labor_total * share.coding"}
  labor_billing:      {stream: VS-6, type: annual, formula: "labor_total * share.billing"}
  labor_posting:      {stream: VS-6, type: annual, formula: "labor_total * share.posting"}
  labor_denials:      {stream: VS-6, type: annual, formula: "labor_total * share.denials"}
  labor_ar:           {stream: VS-6, type: annual, formula: "labor_total * share.ar"}
  labor_pfs:          {stream: VS-6, type: annual, formula: "labor_total * share.pfs"}
  labor_analytics:    {stream: VS-6, type: annual, formula: "labor_total * share.analytics"}
  labor_contracting:  {stream: VS-6, type: annual, formula: "labor_total * share.contracting"}
  cost_external:      {stream: VS-7, type: annual, formula: "npr * external_spend_pct"}
  audit_risk:         {stream: VS-8, type: annual, formula: "npr * audit_exposure_pct * audit_mitigable"}

