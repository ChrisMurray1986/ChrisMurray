# Gate vectors — machine-readable encoding of 08-use-case-gate-profiles.md
# Consumed by score.py together with a filled-in assessment file.
#
# facet_catalog: named, scoreable readiness facts. Each facet belongs to one gate
#   dimension (data/integration/connectivity/workflow/org/governance/legal) and is
#   scored in the assessment as: 0 = absent, 1 = partial/in progress, 2 = ready,
#   or the string "blocked" (legally/contractually prohibited — legal & connectivity
#   facets only).
#
# use_cases: per UC — minimum dimension vector (D I C W O V E L; C null where not
#   binding) and the required facets (its decisive gates). `note` carries the
#   kill/defer condition from file 08.

facet_catalog:
  # ---- data ----
  orders_digitized:        {dim: data, prompt: "Orders/referrals are digitized at intake (e-fax or scan-at-receipt), not handled as physical paper"}
  mspq_structured:         {dim: data, prompt: "MSP questionnaire answers are captured as structured data, not scanned paper"}
  auth_structured:         {dim: data, prompt: "Authorization details (number, CPTs, units, date span) are stored structured, not in free-text notes"}
  denial_labels:           {dim: data, prompt: "Denial outcomes >=12 months linked to accounts with defect/owner attribution (CAP-02)"}
  appeal_outcomes:         {dim: data, prompt: "Appeal outcomes (win/loss/dollars, by level) have been recorded historically"}
  touch_logging:           {dim: data, prompt: "Follow-up touches/actions are logged per account (who did what, when, with what result)"}
  clinical_structured:     {dim: data, prompt: "Labs, vitals, and orders are available as structured data feeds"}
  notes_access:            {dim: data, prompt: "Clinical note text corpus is programmatically accessible and its use is approved"}
  charge_linkage:          {dim: data, prompt: "Orders, eMAR, schedules, and charges can be joined at encounter level across systems"}
  supply_chain_feed:       {dim: data, prompt: "Supply-chain/item-master feed with invoice data, linked to the CDM, is available"}
  acks_retained:           {dim: data, prompt: "999 and 277CA acknowledgments are retained and parsed (not discarded)"}
  lockbox_imaging:         {dim: data, prompt: "Lockbox/mail correspondence is imaged at receipt (bank imaging service or scan-at-receipt)"}
  bank_feeds:              {dim: data, prompt: "Daily bank feeds (BAI2/API) with TRN retention are integrated"}
  takeback_linkage:        {dim: data, prompt: "Recoupment/takeback transactions are linked to their original claims"}
  contract_repository:     {dim: data, prompt: "All executed payer contracts and amendments are located, digitized, and centrally stored"}
  contract_engine_loaded:  {dim: data, prompt: "Expected-reimbursement engine is loaded and verified for payers covering >=80% of volume"}
  policy_library:          {dim: data, prompt: "Versioned, citation-linked payer policy/medical-policy library exists (CAP-04)"}
  provider_master:         {dim: data, prompt: "Provider master is a governed single source (not spreadsheets)"}
  gfe_stored:              {dim: data, prompt: "Good Faith Estimates and patient estimates are stored structured and linkable to final bills"}
  consents_indexed:        {dim: data, prompt: "NSA notice-and-consent artifacts are captured, indexed, and linkable to claims"}
  qa_history:              {dim: data, prompt: "Coding QA results history exists in analyzable (non-spreadsheet) form"}
  audit_outcomes:          {dim: data, prompt: "External/internal audit findings and outcomes are recorded and linked to claims"}
  plan_payment_history:    {dim: data, prompt: "Patient payment-plan histories (installments, declines, timing) are stored structured"}
  payment_timing_history:  {dim: data, prompt: ">=24 months of payer payment-timing history is available"}
  realization_history:     {dim: data, prompt: ">=24 months of cash-realization history by payer/cohort supports reserve modeling"}
  deficiency_structured:   {dim: data, prompt: "HIM documentation-deficiency tracking is structured (not email)"}
  working_drg_recorded:    {dim: data, prompt: "CDI working DRG is recorded and extractable alongside final coded DRG"}
  clearance_outcomes:      {dim: data, prompt: "Financial-clearance outcomes (cleared/deferred/denied-payment results) are recorded as labels"}
  statement_history:       {dim: data, prompt: "Statement response histories (channel, timing, payment response) are stored per patient"}
  audit_channels_digitized: {dim: data, prompt: "Every audit-correspondence channel (mail, portal, fax) is digitized/polled into one intake"}
  peer_benchmarks:         {dim: data, prompt: "Peer benchmark data (E/M distributions etc.) is licensed and available"}
  system_copy_extracts:    {dim: data, prompt: "Every system copy of CDM/payer/provider masters (billing, estimator, MRF, engine) is extractable"}
  edi_telemetry:           {dim: data, prompt: "EDI transaction telemetry (volumes, acks, timestamps by payer/route) is retained"}

  # ---- integration ----
  writeback:               {dim: integration, prompt: "Write-back path exists: transactions, flags, and queue routing can be set programmatically (I3)"}
  fabric:                  {dim: integration, prompt: "Orchestration fabric live: event bus, queue APIs, observability, non-human identity (CAP-05/06/08 = I4)"}
  prebill_hold:            {dim: integration, prompt: "Charges/claims can be programmatically held pre-bill"}
  statement_suppression:   {dim: integration, prompt: "Statement vendor supports per-account suppression via interface"}
  statement_vendor_flex:   {dim: integration, prompt: "Statement vendor supports per-account channel/timing/content variation"}
  ap_refund_path:          {dim: integration, prompt: "Refunds can be executed programmatically into AP/check-issuance systems"}
  cds_ordering_hook:       {dim: integration, prompt: "A decision-support hook exists in the ordering/scheduling workflow"}
  account_360:             {dim: integration, prompt: "A unified account API can assemble balance provenance across HB/PB for a coherent patient answer"}
  queue_api:               {dim: integration, prompt: "Work-queue assignment is API-driven (not manual cherry-picking)"}
  him_retrieval:           {dim: integration, prompt: "Medical records can be retrieved programmatically from EHR/HIM for defined request types"}

  # ---- connectivity ----
  rte_eligibility:         {dim: connectivity, prompt: "Real-time 270/271 eligibility live for payers covering >=80% of volume"}
  era_coverage:            {dim: connectivity, prompt: "ERA (835) covers >=80% of remittance volume"}
  claim_status_edi:        {dim: connectivity, prompt: "276/277 claim status live for major payers"}
  auth_transactions:       {dim: connectivity, prompt: "278/auth-API/portal submission channels available for major payers"}
  portal_automation_permitted: {dim: connectivity, prompt: "Payer portal automation is viable: ToS reviewed/permitted, credentials & MFA managed", blockable: true}
  attachment_channels:     {dim: connectivity, prompt: "Electronic attachment channels (275/portal) exist for major payers"}
  medicaid_files:          {dim: connectivity, prompt: "State Medicaid eligibility files/API (incl. retroactive spans) are accessible"}
  external_registries:     {dim: connectivity, prompt: "Bankruptcy/death/probate data feeds are licensed and integrated", blockable: true}
  agency_data_rights:      {dim: connectivity, prompt: "Collection-agency/vendor contracts grant activity-data, remit-detail, and call-recording access", blockable: true}
  vbc_data_sharing:        {dim: connectivity, prompt: "VBC payer data-sharing (claims extracts, attribution rosters) is contractually granted and flowing"}
  bulletin_access:         {dim: connectivity, prompt: "Payer bulletins/policy pages/transmittals are systematically accessible for ingestion"}

  # ---- workflow ----
  denial_taxonomy:         {dim: workflow, prompt: "A governed denial taxonomy (categories, root-cause owners) exists and is used"}
  appeal_process:          {dim: workflow, prompt: "Appeal processes are standardized by level/payer with owned templates"}
  cdm_governance:          {dim: workflow, prompt: "CDM changes flow through a governed request/review/approval workflow"}
  masterdata_governance:   {dim: workflow, prompt: "Master data (payer/plan, crosswalks) changes are governed with effective-dating (14.1)"}
  collection_policy_unified: {dim: workflow, prompt: "One POS collection policy / discount matrix applies across sites"}
  plan_matrix_unified:     {dim: workflow, prompt: "One payment-plan and discount policy matrix applies across sites"}
  writeoff_matrix:         {dim: workflow, prompt: "A write-off/adjustment approval authority matrix is defined and enforced"}
  query_standardized:      {dim: workflow, prompt: "Physician query practice is standardized to the AHIMA/ACDIS brief"}
  avoidable_day_taxonomy:  {dim: workflow, prompt: "An avoidable-day reason taxonomy exists and is consistently used"}
  filing_matrix:           {dim: workflow, prompt: "Timely-filing limits (initial/corrected/secondary/appeal) are codified per payer/contract"}
  kpi_dictionary:          {dim: workflow, prompt: "KPI definitions are governed in a data dictionary (13.1)"}
  downtime_procedures:     {dim: workflow, prompt: "Downtime billing procedures are documented and have been drilled"}
  refund_matrix:           {dim: workflow, prompt: "A refund approval matrix with thresholds is defined"}
  placement_gates:         {dim: workflow, prompt: "Bad-debt placement gate conditions (statements, FA screen, disputes) are codified"}
  edit_rule_governance:    {dim: workflow, prompt: "Custom claim-edit capability exists with a governed rule-change process (6.2.4)"}
  audit_workflow:          {dim: workflow, prompt: "Audit response workflow with deadline tracking exists (12.1)"}
  handback_queues:         {dim: workflow, prompt: "Named human hand-back queues exist for automation exceptions (GOV-05 wiring)"}
  documentation_stability: {dim: workflow, prompt: "Clinical documentation practice in target charging domains is complete and stable (start/stop times, criteria fields)"}
  posting_standardized:    {dim: workflow, prompt: "Payment-posting rules use one standardized adjustment/transaction-code scheme"}

  # ---- org ----
  routing_authority:       {dim: org, prompt: "Cross-functional routing authority exists: named owners are obligated to accept prevention/policy-change actions"}
  escalation_staffed:      {dim: org, prompt: "Live human escalation is staffed across the operating hours of patient-facing automation"}
  hitl_capacity:           {dim: org, prompt: "Human-in-the-loop review/exception capacity is sized and staffed for planned automations"}
  mpi_capacity:            {dim: org, prompt: "HIM MPI team has capacity to review merge candidates"}
  dept_charge_owners:      {dim: org, prompt: "Departments have named charge owners who will work reconciliation/gap lists"}
  ranked_list_adoption:    {dim: org, prompt: "AR management has committed to ranked worklists over aging-bucket cherry-picking"}
  provider_adoption:       {dim: org, prompt: "A provider workflow-adoption path (champions, governance, training) exists for provider-facing tools"}
  compliance_charter:      {dim: org, prompt: "Compliance charter covers billing-pattern surveillance and defines how findings are used"}

  # ---- governance ----
  gov_body:                {dim: governance, prompt: "An AI governance body exists that tiers use cases and approves autonomy changes (GOV-01)"}
  decision_logging:        {dim: governance, prompt: "Decision logging + model/prompt version control are operational (GOV-02/11, CAP-10)"}
  model_monitoring:        {dim: governance, prompt: "Model monitoring with drift detection and auto-demotion is live (CAP-06, UC-13-04)"}
  bias_program:            {dim: governance, prompt: "Bias/adverse-impact testing program for patient-affecting models is operational (GOV-06)"}
  citation_harness:        {dim: governance, prompt: "A citation-verification harness validates generative citations against sources (GOV-03)"}
  golden_sets:             {dim: governance, prompt: "Golden evaluation datasets exist (or are planned per use case) for release gating (CAP-09)"}
  lineage:                 {dim: governance, prompt: "Data/model lineage tooling can evidence how a figure was produced (external-audit grade)"}

  # ---- legal ----
  baa_program:             {dim: legal, prompt: "BAA + privacy/security review process for AI vendors and PHI flows is in place"}
  outreach_consent:        {dim: legal, prompt: "TCPA/consent capture for automated outreach (text/voice) is implemented", blockable: true}
  criteria_license:        {dim: legal, prompt: "MCG/InterQual license permits programmatic criteria mapping", blockable: true}
  reference_license:       {dim: legal, prompt: "Coding references (Coding Clinic, NCCI manuals) are licensed for programmatic retrieval use", blockable: true}
  socio_data_license:      {dim: legal, prompt: "External socioeconomic/credit data for FA scoring is licensed and legally permissible", blockable: true}
  privilege_protocol:      {dim: legal, prompt: "A privilege protocol governs counsel-directed analytical work product"}
  recoupment_law_matrix:   {dim: legal, prompt: "A maintained matrix of state/contract recoupment rules exists"}
  fa_501r_review:          {dim: legal, prompt: "Financial assistance / collection policies have current 501(r) counsel review"}

# ---------------------------------------------------------------------------

use_cases:
  # ---------------- RC-01 Patient Access ----------------
