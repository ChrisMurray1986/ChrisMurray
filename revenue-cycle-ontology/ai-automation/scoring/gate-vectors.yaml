  UC-05-06: {name: "QA sampling optimizer",               vector: {D: 4, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [qa_history], note: "1-2 quarters of structured QA capture if history is spreadsheets"}
  UC-05-07: {name: "Edit/denial coding assist",           vector: {D: 3, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 2}, facets: [reference_license, citation_harness], note: "License rights for programmatic reference use"}

  # ---------------- RC-06 Claims ----------------
  UC-06-01: {name: "Denial risk scoring",                 vector: {D: 4, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [denial_labels, writeback], note: "Pilot A0 score display while hold policy is negotiated"}
  UC-06-02: {name: "Edit resolution agent",               vector: {D: 3, I: 4, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [fabric, edit_rule_governance], note: "A3 only per governed class"}
  UC-06-03: {name: "Edit rule mining",                    vector: {D: 4, I: 2, C: null, W: 3, O: 1, V: 2, E: 2, L: 1}, facets: [denial_labels, edit_rule_governance], note: "Defer if edit rules are vendor-locked"}
  UC-06-04: {name: "Submission integrity reconciler",     vector: {D: 3, I: 3, C: 1, W: 3, O: 1, V: 2, E: 1, L: 1}, facets: [acks_retained], note: "Turn on ack retention, then straightforward — Wave-1"}
  UC-06-05: {name: "Rejection auto-repair",               vector: {D: 3, I: 4, C: 1, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [fabric, edit_rule_governance], note: "A1 first, same pattern as 06-02"}
  UC-06-06: {name: "Timely filing sentinel",              vector: {D: 3, I: 3, C: null, W: 3, O: 1, V: 2, E: 1, L: 1}, facets: [filing_matrix], note: "Contract-matrix load is the prerequisite"}
  UC-06-07: {name: "Attachment prediction/assembly",      vector: {D: 4, I: 3, C: 2, W: 2, O: 2, V: 2, E: 2, L: 1}, facets: [attachment_channels], note: "Scope-cut fax-only payers"}
  UC-06-08: {name: "COB/secondary automation",            vector: {D: 3, I: 3, C: 1, W: 3, O: 1, V: 3, E: 2, L: 1}, facets: [era_coverage], note: "UC-07-03 feeds this for paper-remit payers"}

  # ---------------- RC-07 Payments ----------------
  UC-07-01: {name: "Intelligent auto-posting",            vector: {D: 3, I: 3, C: 1, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [era_coverage, posting_standardized], note: "ERA/EFT enrollment campaign first if paper-heavy"}
  UC-07-02: {name: "CARC mapping intelligence",           vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 2, E: 1, L: 1}, facets: [denial_taxonomy], note: "Without a taxonomy the model learns today's mis-mappings"}
  UC-07-03: {name: "Paper EOB/correspondence IDP",        vector: {D: 2, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [lockbox_imaging, golden_sets], note: "Switch lockbox to imaging service (contract change)"}
