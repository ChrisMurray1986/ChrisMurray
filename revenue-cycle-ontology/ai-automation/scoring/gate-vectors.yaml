  UC-01-06: {name: "COB/MSP primacy inference",           vector: {D: 3, I: 2, C: 2, W: 2, O: 2, V: 2, E: 1, L: 1}, facets: [mspq_structured], note: "Capture-first if MSPQ is paper-only"}
  UC-01-07: {name: "Auth requirement engine",             vector: {D: 3, I: 3, C: 3, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [bulletin_access, portal_automation_permitted], note: "Stale grid worse than none — needs policy-monitoring feed"}
  UC-01-08: {name: "Auth submission agent",               vector: {D: 3, I: 4, C: 3, W: 3, O: 2, V: 2, E: 2, L: 2}, facets: [fabric, auth_transactions, notes_access, citation_harness, portal_automation_permitted], note: "Wave-0 fabric + GOV-03 harness prerequisites"}
  UC-01-09: {name: "Auth status tracking bots",           vector: {D: 2, I: 3, C: 3, W: 3, O: 1, V: 2, E: 2, L: 2}, facets: [portal_automation_permitted, fabric], note: "Kill per payer segment if ToS prohibits with no 278/API alternative"}
  UC-01-10: {name: "Auth-to-service reconciliation",      vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [auth_structured], note: "Structure auth capture first if details live in notes"}
  UC-01-11: {name: "Necessity screening & dx assist",     vector: {D: 3, I: 3, C: null, W: 2, O: 2, V: 2, E: 2, L: 2}, facets: [cds_ordering_hook, provider_adoption], note: "Post-hoc screening loses most value — needs ordering-workflow hook"}
  UC-01-12: {name: "Estimate accuracy engine",            vector: {D: 4, I: 3, C: 2, W: 2, O: 2, V: 3, E: 2, L: 2}, facets: [contract_engine_loaded, rte_eligibility], note: "Estimates without loaded contract terms are fiction"}
  UC-01-13: {name: "Clearance risk scoring",              vector: {D: 4, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [clearance_outcomes, hitl_capacity], note: "Deferral recommendations stay A1 forever (GOV-09)"}
  UC-01-14: {name: "Conversational pre-registration",     vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 2, L: 3}, facets: [outreach_consent, escalation_staffed], note: "Kill without staffed human escalation coverage"}
  UC-01-15: {name: "POS next-best-action",                vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 2}, facets: [collection_policy_unified], note: "Standardize collection policy across sites first"}
  UC-01-16: {name: "Real-time registration QA",           vector: {D: 4, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [denial_labels, writeback], note: "Rules-only version can start at D3"}
  UC-01-17: {name: "No-show revenue protection",          vector: {D: 4, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 3}, facets: [outreach_consent], note: "Kill for low-volume lines; pool with UC-01-14 infrastructure"}

  # ---------------- RC-02 Utilization Review ----------------
  UC-02-01: {name: "Admission status prediction",         vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [clinical_structured], note: "Defer if clinical data is text-only"}
  UC-02-02: {name: "Criteria auto-abstraction",           vector: {D: 3, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 2}, facets: [notes_access, criteria_license], note: "Contractual gate: licensor must permit programmatic use"}
  UC-02-03: {name: "Payer notification/submission bots",  vector: {D: 3, I: 3, C: 3, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [portal_automation_permitted], note: "Scope-cut to payers with viable channels"}
  UC-02-04: {name: "Auth-days runway monitor",            vector: {D: 3, I: 3, C: null, W: 3, O: 1, V: 2, E: 1, L: 1}, facets: [auth_structured], note: "Same structured-auth gate as UC-01-10"}
  UC-02-05: {name: "Avoidable-day classification",        vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [avoidable_day_taxonomy, notes_access], note: "Define the taxonomy first"}

  # ---------------- RC-03 Charge Capture ----------------
  UC-03-01: {name: "Missing charge detection",            vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 1}, facets: [charge_linkage, dept_charge_owners], note: "Kill per dept if no owner accepts the queue"}
  UC-03-02: {name: "Dup/anomaly charge screening",        vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [prebill_hold], note: "Downgrade to post-bill lists without pre-bill hold"}
  UC-03-03: {name: "Drug units validator",                vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [masterdata_governance], note: "Govern the NDC crosswalk table first"}
  UC-03-04: {name: "Charge trigger surveillance",         vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [], note: "Low bar — Wave-1 candidate almost everywhere"}
  UC-03-05: {name: "CDM update automation",               vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 1, L: 1}, facets: [cdm_governance], note: "Defer if CDM changes happen by direct edit"}
  UC-03-06: {name: "Autonomous charging",                 vector: {D: 4, I: 3, C: null, W: 4, O: 2, V: 3, E: 2, L: 1}, facets: [documentation_stability], note: "Enable domain-by-domain; capture-first where documentation incomplete"}
  UC-03-07: {name: "Device/implant reconciliation",       vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 2, L: 1}, facets: [supply_chain_feed], note: "Point-of-use capture project first if OR supplies are paper stickers"}
  UC-03-08: {name: "MRF/transparency pipeline",           vector: {D: 3, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 2}, facets: [contract_engine_loaded], note: "Bad terms data automates noncompliance"}

  # ---------------- RC-04 CDI ----------------
  UC-04-01: {name: "CDI case prioritization",             vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 1}, facets: [notes_access], note: "Label backfill from encoder + query tool history"}
  UC-04-02: {name: "Evidence surfacing",                  vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [notes_access], note: "A0, low risk, feasible early"}
  UC-04-03: {name: "Compliant query drafting",            vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 2, L: 1}, facets: [query_standardized, citation_harness], note: "Standardize the human query process first"}
  UC-04-04: {name: "HCC suspecting & recapture",          vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 2}, facets: [notes_access, provider_adoption], note: "Kill if no VBC/MA population"}
  UC-04-05: {name: "DRG reconciliation triage",           vector: {D: 3, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [working_drg_recorded], note: "Trivial where CDI+coding share a platform"}

  # ---------------- RC-05 Coding ----------------
  UC-05-01: {name: "Autonomous/assisted coding",          vector: {D: 4, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [golden_sets, model_monitoring, notes_access], note: "Scope by case type; never kill wholesale"}
  UC-05-02: {name: "DRG risk scoring",                    vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [audit_outcomes, hitl_capacity], note: "Instrument audit outcomes first if unrecorded"}
  UC-05-03: {name: "Disposition validator",               vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 2, L: 1}, facets: [], note: "Rules-only version feasible everywhere; external signals need HIE"}
  UC-05-04: {name: "Deficiency chase automation",         vector: {D: 3, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [deficiency_structured], note: "W2 the deficiency process first if ad hoc"}
