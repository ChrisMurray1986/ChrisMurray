  UC-01-02: {name: "Identity resolution / dup MRN",       vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [mpi_capacity], note: "Merge is always human (GOV-09)"}
  UC-01-03: {name: "Card OCR & plan mapping",             vector: {D: 4, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [denial_labels, masterdata_governance], note: "Fix payer master governance before training a mapper into it"}
  UC-01-04: {name: "Eligibility orchestration",           vector: {D: 3, I: 3, C: 2, W: 3, O: 1, V: 2, E: 2, L: 2}, facets: [rte_eligibility, portal_automation_permitted], note: "RTE enrollment campaign; scope-cut payers with no electronic path"}
