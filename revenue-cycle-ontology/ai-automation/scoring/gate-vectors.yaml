# Gate vectors — machine-readable encoding of 08-use-case-gate-profiles.md
# Consumed by score.py together with a filled-in assessment file.
#
# facet_catalog: named, scoreable readiness facts. Each facet belongs to one gate
#   dimension (data/integration/connectivity/workflow/org/governance/legal) and is
#   scored in the assessment as: 0 = absent, 1 = partial/in progress, 2 = ready,
#   or the string "blocked" (legally/contractually prohibited — legal & connectivity
#   facets only).
#
# use_cases: per UC — minimum dimension vector (D I C W O V E L; C null where not
#   binding) and the required facets (its decisive gates). `note` carries the
#   kill/defer condition from file 08.

facet_catalog:
  # ---- data ----
  orders_digitized:        {dim: data, prompt: "Orders/referrals are digitized at intake (e-fax or scan-at-receipt), not handled as physical paper", class: failure-explained}
  mspq_structured:         {dim: data, prompt: "MSP questionnaire answers are captured as structured data, not scanned paper", class: failure-explained}
  auth_structured:         {dim: data, prompt: "Authorization details (number, CPTs, units, date span) are stored structured, not in free-text notes", class: failure-explained}
  denial_labels:           {dim: data, prompt: "Denial outcomes >=12 months linked to accounts with defect/owner attribution (CAP-02)", class: failure-explained}
  appeal_outcomes:         {dim: data, prompt: "Appeal outcomes (win/loss/dollars, by level) have been recorded historically", class: failure-explained}
  touch_logging:           {dim: data, prompt: "Follow-up touches/actions are logged per account (who did what, when, with what result)", class: failure-explained}
  clinical_structured:     {dim: data, prompt: "Labs, vitals, and orders are available as structured data feeds", class: failure-explained}
  notes_access:            {dim: data, prompt: "Clinical note text corpus is programmatically accessible and its use is approved", class: contractual}
  charge_linkage:          {dim: data, prompt: "Orders, eMAR, schedules, and charges can be joined at encounter level across systems", class: failure-explained}
  supply_chain_feed:       {dim: data, prompt: "Supply-chain/item-master feed with invoice data, linked to the CDM, is available", class: new-capability}
  acks_retained:           {dim: data, prompt: "999 and 277CA acknowledgments are retained and parsed (not discarded)", class: failure-explained}
  lockbox_imaging:         {dim: data, prompt: "Lockbox/mail correspondence is imaged at receipt (bank imaging service or scan-at-receipt)", class: contractual}
  bank_feeds:              {dim: data, prompt: "Daily bank feeds (BAI2/API) with TRN retention are integrated", class: new-capability}
  takeback_linkage:        {dim: data, prompt: "Recoupment/takeback transactions are linked to their original claims", class: failure-explained}
  contract_repository:     {dim: data, prompt: "All executed payer contracts and amendments are located, digitized, and centrally stored", class: failure-explained}
  contract_engine_loaded:  {dim: data, prompt: "Expected-reimbursement engine is loaded and verified for payers covering >=80% of volume", class: failure-explained}
  policy_library:          {dim: data, prompt: "Versioned, citation-linked payer policy/medical-policy library exists (CAP-04)", class: new-capability}
  provider_master:         {dim: data, prompt: "Provider master is a governed single source (not spreadsheets)", class: failure-explained}
  gfe_stored:              {dim: data, prompt: "Good Faith Estimates and patient estimates are stored structured and linkable to final bills", class: failure-explained}
  consents_indexed:        {dim: data, prompt: "NSA notice-and-consent artifacts are captured, indexed, and linkable to claims", class: failure-explained}
  qa_history:              {dim: data, prompt: "Coding QA results history exists in analyzable (non-spreadsheet) form", class: failure-explained}
  audit_outcomes:          {dim: data, prompt: "External/internal audit findings and outcomes are recorded and linked to claims", class: failure-explained}
  plan_payment_history:    {dim: data, prompt: "Patient payment-plan histories (installments, declines, timing) are stored structured", class: failure-explained}
  payment_timing_history:  {dim: data, prompt: ">=24 months of payer payment-timing history is available", class: failure-explained}
  realization_history:     {dim: data, prompt: ">=24 months of cash-realization history by payer/cohort supports reserve modeling", class: failure-explained}
  deficiency_structured:   {dim: data, prompt: "HIM documentation-deficiency tracking is structured (not email)", class: failure-explained}
  working_drg_recorded:    {dim: data, prompt: "CDI working DRG is recorded and extractable alongside final coded DRG", class: failure-explained}
  clearance_outcomes:      {dim: data, prompt: "Financial-clearance outcomes (cleared/deferred/denied-payment results) are recorded as labels", class: failure-explained}
  statement_history:       {dim: data, prompt: "Statement response histories (channel, timing, payment response) are stored per patient", class: new-capability}
  audit_channels_digitized: {dim: data, prompt: "Every audit-correspondence channel (mail, portal, fax) is digitized/polled into one intake", class: failure-explained}
  peer_benchmarks:         {dim: data, prompt: "Peer benchmark data (E/M distributions etc.) is licensed and available", class: contractual}
  system_copy_extracts:    {dim: data, prompt: "Every system copy of CDM/payer/provider masters (billing, estimator, MRF, engine) is extractable", class: failure-explained}
  card_images:             {dim: data, prompt: "Insurance card images are captured digitally at registration/pre-registration (front and back)", class: failure-explained}
  um_worksheets:           {dim: data, prompt: "UR criteria worksheets and determinations (incl. final status outcomes) are stored structured", class: failure-explained}
  edi_telemetry:           {dim: data, prompt: "EDI transaction telemetry (volumes, acks, timestamps by payer/route) is retained", class: failure-explained}
  intended_cpt_accuracy:   {dim: data, prompt: "Intended-procedure codes at scheduling/order time (order-set, visit-type, or preference-card derived) are measured against performed CPTs, with mismatch and auth-workqueue routing-miss rates tracked", class: failure-explained}
  auth_grid_accuracy:      {dim: data, prompt: "The auth-requirements grid (payer x plan x CPT x site — e.g., Epic ASA) is accuracy-sampled against current payer policy on a cadence, versioned with source citations", class: failure-explained}

  # ---- integration ----
  writeback:               {dim: integration, prompt: "Write-back path exists: transactions, flags, and queue routing can be set programmatically (I3)", class: new-capability}
  fabric:                  {dim: integration, prompt: "Orchestration fabric live: event bus, queue APIs, observability, non-human identity (CAP-05/06/08 = I4)", class: new-capability}
  prebill_hold:            {dim: integration, prompt: "Charges/claims can be programmatically held pre-bill", class: failure-explained}
  statement_suppression:   {dim: integration, prompt: "Statement vendor supports per-account suppression via interface", class: new-capability}
  statement_vendor_flex:   {dim: integration, prompt: "Statement vendor supports per-account channel/timing/content variation", class: new-capability}
  ap_refund_path:          {dim: integration, prompt: "Refunds can be executed programmatically into AP/check-issuance systems", class: new-capability}
  cds_ordering_hook:       {dim: integration, prompt: "A decision-support hook exists in the ordering/scheduling workflow", class: new-capability}
  account_360:             {dim: integration, prompt: "A unified account API can assemble balance provenance across HB/PB for a coherent patient answer", class: new-capability}
  queue_api:               {dim: integration, prompt: "Work-queue assignment is API-driven (not manual cherry-picking)", class: failure-explained}
  him_retrieval:           {dim: integration, prompt: "Medical records can be retrieved programmatically from EHR/HIM for defined request types", class: failure-explained}

  # ---- connectivity ----
  rte_eligibility:         {dim: connectivity, prompt: "Real-time 270/271 eligibility live for payers covering >=80% of volume", class: new-capability}
  era_coverage:            {dim: connectivity, prompt: "ERA (835) covers >=80% of remittance volume", class: new-capability}
  claim_status_edi:        {dim: connectivity, prompt: "276/277 claim status live for major payers", class: new-capability}
  auth_transactions:       {dim: connectivity, prompt: "278/auth-API/portal submission channels available for major payers", class: new-capability}
  portal_automation_permitted: {dim: connectivity, prompt: "Payer portal automation is viable: ToS reviewed/permitted, credentials & MFA managed", blockable: true, class: contractual}
  attachment_channels:     {dim: connectivity, prompt: "Electronic attachment channels (275/portal) exist for major payers", class: new-capability}
  medicaid_files:          {dim: connectivity, prompt: "State Medicaid eligibility files/API (incl. retroactive spans) are accessible", class: contractual}
  external_registries:     {dim: connectivity, prompt: "Bankruptcy/death/probate data feeds are licensed and integrated", blockable: true, class: contractual}
  agency_data_rights:      {dim: connectivity, prompt: "Collection-agency/vendor contracts grant activity-data, remit-detail, and call-recording access", blockable: true, class: contractual}
  vbc_data_sharing:        {dim: connectivity, prompt: "VBC payer data-sharing (claims extracts, attribution rosters) is contractually granted and flowing", class: contractual}
  bulletin_access:         {dim: connectivity, prompt: "Payer bulletins/policy pages/transmittals are systematically accessible for ingestion", class: failure-explained}
  rte_benefit_depth:       {dim: connectivity, prompt: "271 responses return service-type-specific benefit detail (cost-share, carve-outs) for top service lines/payers — payer-specific query construction and follow-up chaining configured, not generic STC-30 pings", class: failure-explained}

  # ---- workflow ----
  denial_taxonomy:         {dim: workflow, prompt: "A governed denial taxonomy (categories, root-cause owners) exists and is used", class: failure-explained}
  appeal_process:          {dim: workflow, prompt: "Appeal processes are standardized by level/payer with owned templates", class: failure-explained}
  cdm_governance:          {dim: workflow, prompt: "CDM changes flow through a governed request/review/approval workflow", class: failure-explained}
  masterdata_governance:   {dim: workflow, prompt: "Master data (payer/plan, crosswalks) changes are governed with effective-dating (14.1)", class: failure-explained}
  collection_policy_unified: {dim: workflow, prompt: "One POS collection policy / discount matrix applies across sites", class: failure-explained}
  plan_matrix_unified:     {dim: workflow, prompt: "One payment-plan and discount policy matrix applies across sites", class: failure-explained}
  writeoff_matrix:         {dim: workflow, prompt: "A write-off/adjustment approval authority matrix is defined and enforced", class: failure-explained}
  query_standardized:      {dim: workflow, prompt: "Physician query practice is standardized to the AHIMA/ACDIS brief", class: failure-explained}
  avoidable_day_taxonomy:  {dim: workflow, prompt: "An avoidable-day reason taxonomy exists and is consistently used", class: failure-explained}
  filing_matrix:           {dim: workflow, prompt: "Timely-filing limits (initial/corrected/secondary/appeal) are codified per payer/contract", class: failure-explained}
  kpi_dictionary:          {dim: workflow, prompt: "KPI definitions are governed in a data dictionary (13.1)", class: failure-explained}
  downtime_procedures:     {dim: workflow, prompt: "Downtime billing procedures are documented and have been drilled", class: failure-explained}
  refund_matrix:           {dim: workflow, prompt: "A refund approval matrix with thresholds is defined", class: failure-explained}
  placement_gates:         {dim: workflow, prompt: "Bad-debt placement gate conditions (statements, FA screen, disputes) are codified", class: failure-explained}
  edit_rule_governance:    {dim: workflow, prompt: "Custom claim-edit capability exists with a governed rule-change process (6.2.4)", class: failure-explained}
  audit_workflow:          {dim: workflow, prompt: "Audit response workflow with deadline tracking exists (12.1)", class: failure-explained}
  handback_queues:         {dim: workflow, prompt: "Named human hand-back queues exist for automation exceptions (GOV-05 wiring)", class: failure-explained}
  documentation_stability: {dim: workflow, prompt: "Clinical documentation practice in target charging domains is complete and stable (start/stop times, criteria fields)", class: failure-explained}
  posting_standardized:    {dim: workflow, prompt: "Payment-posting rules use one standardized adjustment/transaction-code scheme", class: failure-explained}
  clinical_build_governance: {dim: workflow, prompt: "Clinical-system build changes (order sets, visit types/scheduling trees, preference cards, documentation templates) pass revenue-impact review before release, with charge-trigger/auth-mapping regression (14.2)", class: failure-explained}
  native_capability_inventory: {dim: workflow, prompt: "A current inventory of licensed EHR-native automation/AI capabilities exists with lit/unlit status and adoption owners; native options are evaluated before any bolt-on purchase", class: failure-explained}

  # ---- org ----
  routing_authority:       {dim: org, prompt: "Cross-functional routing authority exists: named owners are obligated to accept prevention/policy-change actions", class: failure-explained}
  escalation_staffed:      {dim: org, prompt: "Live human escalation is staffed across the operating hours of patient-facing automation", class: failure-explained}
  hitl_capacity:           {dim: org, prompt: "Human-in-the-loop review/exception capacity is sized and staffed for planned automations", class: failure-explained}
  mpi_capacity:            {dim: org, prompt: "HIM MPI team has capacity to review merge candidates", class: failure-explained}
  dept_charge_owners:      {dim: org, prompt: "Departments have named charge owners who will work reconciliation/gap lists", class: failure-explained}
  ranked_list_adoption:    {dim: org, prompt: "AR management has committed to ranked worklists over aging-bucket cherry-picking", class: failure-explained}
  provider_adoption:       {dim: org, prompt: "A provider workflow-adoption path (champions, governance, training) exists for provider-facing tools", class: failure-explained}
  compliance_charter:      {dim: org, prompt: "Compliance charter covers billing-pattern surveillance and defines how findings are used", class: failure-explained}

  # ---- governance ----
  gov_body:                {dim: governance, prompt: "An AI governance body exists that tiers use cases and approves autonomy changes (GOV-01)", class: new-capability}
  decision_logging:        {dim: governance, prompt: "Decision logging + model/prompt version control are operational (GOV-02/11, CAP-10)", class: new-capability}
  model_monitoring:        {dim: governance, prompt: "Model monitoring with drift detection and auto-demotion is live (CAP-06, UC-13-04)", class: new-capability}
  bias_program:            {dim: governance, prompt: "Bias/adverse-impact testing program for patient-affecting models is operational (GOV-06)", class: new-capability}
  citation_harness:        {dim: governance, prompt: "A citation-verification harness validates generative citations against sources (GOV-03)", class: new-capability}
  golden_sets:             {dim: governance, prompt: "Golden evaluation datasets exist (or are planned per use case) for release gating (CAP-09)", class: new-capability}
  lineage:                 {dim: governance, prompt: "Data/model lineage tooling can evidence how a figure was produced (external-audit grade)", class: new-capability}

  # ---- legal ----
  baa_program:             {dim: legal, prompt: "BAA + privacy/security review process for AI vendors and PHI flows is in place", class: contractual}
  outreach_consent:        {dim: legal, prompt: "TCPA/consent capture for automated outreach (text/voice) is implemented", blockable: true, class: contractual}
  criteria_license:        {dim: legal, prompt: "MCG/InterQual license permits programmatic criteria mapping", blockable: true, class: contractual}
  reference_license:       {dim: legal, prompt: "Coding references (Coding Clinic, NCCI manuals) are licensed for programmatic retrieval use", blockable: true, class: contractual}
  socio_data_license:      {dim: legal, prompt: "External socioeconomic/credit data for FA scoring is licensed and legally permissible", blockable: true, class: contractual}
  privilege_protocol:      {dim: legal, prompt: "A privilege protocol governs counsel-directed analytical work product", class: contractual}
  recoupment_law_matrix:   {dim: legal, prompt: "A maintained matrix of state/contract recoupment rules exists", class: contractual}
  fa_501r_review:          {dim: legal, prompt: "Financial assistance / collection policies have current 501(r) counsel review", class: contractual}

# ---------------------------------------------------------------------------

use_cases:
  # ---------------- RC-01 Patient Access ----------------
  UC-01-01: {name: "Order intake document AI",            vector: {D: 2, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [orders_digitized, golden_sets], note: "Defer if orders remain physical paper; kill if volume immaterial"}
  UC-01-02: {name: "Identity resolution / dup MRN",       vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [mpi_capacity], note: "Merge is always human (GOV-09)"}
  UC-01-03: {name: "Card OCR & plan mapping",             vector: {D: 4, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [denial_labels, masterdata_governance, card_images], note: "Fix payer master governance before training a mapper into it"}
  UC-01-04: {name: "Eligibility orchestration",           vector: {D: 3, I: 3, C: 2, W: 3, O: 1, V: 2, E: 2, L: 2}, facets: [rte_eligibility, rte_benefit_depth, portal_automation_permitted], note: "RTE enrollment campaign; scope-cut payers with no electronic path. Volume without benefit depth automates the portal-lookup workaround, not verification"}
  UC-01-05: {name: "Coverage discovery sweep",            vector: {D: 3, I: 3, C: 2, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [medicaid_files, rte_eligibility], note: "Monitor false-attach rate from day one"}
  UC-01-06: {name: "COB/MSP primacy inference",           vector: {D: 3, I: 2, C: 2, W: 2, O: 2, V: 2, E: 1, L: 1}, facets: [mspq_structured], note: "Capture-first if MSPQ is paper-only"}
  UC-01-07: {name: "Auth requirement engine",             vector: {D: 3, I: 3, C: 3, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [bulletin_access, portal_automation_permitted, masterdata_governance, intended_cpt_accuracy], note: "Stale grid worse than none — needs policy-monitoring feed. The lookup key comes from order-set/visit-type build: a right grid answers wrong questions if intended CPTs are unmeasured"}
  UC-01-08: {name: "Auth submission agent",               vector: {D: 3, I: 4, C: 3, W: 3, O: 2, V: 2, E: 2, L: 2}, facets: [fabric, auth_transactions, notes_access, citation_harness, portal_automation_permitted, policy_library, auth_grid_accuracy, intended_cpt_accuracy], note: "Wave-0 fabric + GOV-03 harness prerequisites. Consumes grid verdicts: false 'no-auth' upstream means the agent never sees the case"}
  UC-01-09: {name: "Auth status tracking bots",           vector: {D: 2, I: 3, C: 3, W: 3, O: 1, V: 2, E: 2, L: 2}, facets: [portal_automation_permitted, fabric], note: "Kill per payer segment if ToS prohibits with no 278/API alternative"}
  UC-01-10: {name: "Auth-to-service reconciliation",      vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [auth_structured], note: "Structure auth capture first if details live in notes"}
  UC-01-11: {name: "Necessity screening & dx assist",     vector: {D: 3, I: 3, C: null, W: 2, O: 2, V: 2, E: 2, L: 2}, facets: [cds_ordering_hook, provider_adoption, policy_library], note: "Post-hoc screening loses most value — needs ordering-workflow hook"}
  UC-01-12: {name: "Estimate accuracy engine",            vector: {D: 4, I: 3, C: 2, W: 2, O: 2, V: 3, E: 2, L: 2}, facets: [contract_engine_loaded, rte_eligibility, rte_benefit_depth, gfe_stored, intended_cpt_accuracy], note: "Estimates without loaded contract terms are fiction; without benefit depth and intended-CPT fidelity they are precise fictions"}
  UC-01-13: {name: "Clearance risk scoring",              vector: {D: 4, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [clearance_outcomes, hitl_capacity], note: "Deferral recommendations stay A1 forever (GOV-09)"}
  UC-01-14: {anchor: opportunity, name: "Conversational pre-registration",     vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 2, L: 3}, facets: [outreach_consent, escalation_staffed], note: "Kill without staffed human escalation coverage"}
  UC-01-15: {name: "POS next-best-action",                vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 2}, facets: [collection_policy_unified], note: "Standardize collection policy across sites first"}
  UC-01-16: {name: "Real-time registration QA",           vector: {D: 4, I: 3, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [denial_labels, writeback], note: "Rules-only version can start at D3"}
  UC-01-17: {name: "No-show revenue protection",          vector: {D: 4, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 3}, facets: [outreach_consent], note: "Kill for low-volume lines; pool with UC-01-14 infrastructure"}

  # ---------------- RC-02 Utilization Review ----------------
  UC-02-01: {name: "Admission status prediction",         vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [clinical_structured, um_worksheets], note: "Defer if clinical data is text-only"}
  UC-02-02: {name: "Criteria auto-abstraction",           vector: {D: 3, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 2}, facets: [notes_access, criteria_license, um_worksheets], note: "Contractual gate: licensor must permit programmatic use"}
  UC-02-03: {name: "Payer notification/submission bots",  vector: {D: 3, I: 3, C: 3, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [portal_automation_permitted, notes_access], note: "Scope-cut to payers with viable channels"}
  UC-02-04: {name: "Auth-days runway monitor",            vector: {D: 3, I: 3, C: null, W: 3, O: 1, V: 2, E: 1, L: 1}, facets: [auth_structured], note: "Same structured-auth gate as UC-01-10"}
  UC-02-05: {name: "Avoidable-day classification",        vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [avoidable_day_taxonomy, notes_access], note: "Define the taxonomy first"}

  # ---------------- RC-03 Charge Capture ----------------
  UC-03-01: {name: "Missing charge detection",            vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 1}, facets: [charge_linkage, dept_charge_owners], note: "Kill per dept if no owner accepts the queue"}
  UC-03-02: {name: "Dup/anomaly charge screening",        vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [prebill_hold], note: "Downgrade to post-bill lists without pre-bill hold"}
  UC-03-03: {name: "Drug units validator",                vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 1}, facets: [masterdata_governance], note: "Govern the NDC crosswalk table first"}
  UC-03-04: {name: "Charge trigger surveillance",         vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [], note: "Low bar — Wave-1 candidate almost everywhere"}
  UC-03-05: {name: "CDM update automation",               vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 1, L: 1}, facets: [cdm_governance, reference_license], note: "Defer if CDM changes happen by direct edit"}
  UC-03-06: {name: "Autonomous charging",                 vector: {D: 4, I: 3, C: null, W: 4, O: 2, V: 3, E: 2, L: 1}, facets: [documentation_stability, notes_access, golden_sets, clinical_build_governance], note: "Enable domain-by-domain; capture-first where documentation incomplete. Charges fire from order/doc build — ungoverned clinical build changes silently retrain the trigger surface"}
  UC-03-07: {anchor: opportunity, name: "Device/implant reconciliation",       vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 2, L: 1}, facets: [supply_chain_feed], note: "Point-of-use capture project first if OR supplies are paper stickers"}
  UC-03-08: {name: "MRF/transparency pipeline",           vector: {D: 3, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 2}, facets: [contract_engine_loaded], note: "Bad terms data automates noncompliance"}

  # ---------------- RC-04 CDI ----------------
  UC-04-01: {name: "CDI case prioritization",             vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 2, E: 2, L: 1}, facets: [notes_access, working_drg_recorded], note: "Label backfill from encoder + query tool history"}
  UC-04-02: {anchor: opportunity, name: "Evidence surfacing",                  vector: {D: 3, I: 2, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [notes_access], note: "A0, low risk, feasible early"}
  UC-04-03: {name: "Compliant query drafting",            vector: {D: 3, I: 3, C: null, W: 3, O: 2, V: 2, E: 2, L: 1}, facets: [query_standardized, citation_harness, notes_access], note: "Standardize the human query process first"}
  UC-04-04: {name: "HCC suspecting & recapture",          vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 2}, facets: [notes_access, provider_adoption], note: "Kill if no VBC/MA population"}
  UC-04-05: {name: "DRG reconciliation triage",           vector: {D: 3, I: 3, C: null, W: 2, O: 1, V: 2, E: 1, L: 1}, facets: [working_drg_recorded], note: "Trivial where CDI+coding share a platform"}

  # ---------------- RC-05 Coding ----------------
  UC-05-01: {anchor: opportunity, name: "Autonomous/assisted coding",          vector: {D: 4, I: 3, C: null, W: 3, O: 2, V: 3, E: 2, L: 2}, facets: [golden_sets, model_monitoring, notes_access, reference_license], note: "Scope by case type; never kill wholesale"}
  UC-05-02: {anchor: opportunity, name: "DRG risk scoring",                    vector: {D: 4, I: 2, C: null, W: 2, O: 2, V: 3, E: 2, L: 1}, facets: [audit_outcomes, hitl_capacity], note: "Instrument audit outcomes first if unrecorded"}
