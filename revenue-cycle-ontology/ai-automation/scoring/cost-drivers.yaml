# Cost drivers — machine-readable implementation of 10-cost-model.md.
# Consumed by cost.py with an org profile. All rates are defaults; override any
# of them in the org profile under an optional `cost_rates:` / `volumes:` block.
#
# Per-UC binding fields:
#   tier: S/M/L/XL build complexity        workload: rules|rpa|ml|idp|nlp|llm|conv
#   vol: volume-driver key   mult: fraction/multiple of that volume the UC processes yearly
#   integ: integration count (default 2)   tokens: per-txn override (else workload default)
#   hitl_share/hitl_min: override the workload's review burden — encode the MATURE-state
#     autonomy (A2 human-approve ~= 1.0 share; A3 audit-sampling ~= 0.1-0.2 share)
#   payer: edi|portal|both (payer connectivity cost)   flags: [agentic, kb]
#   vendor_txn: vendor per-transaction fee $ (vendor option skipped if absent)
#   diff: true = strategic differentiator (vendor must win by >15% to be recommended)

rates:
  eng_week_rate: 6000
  tier_weeks: {S: 6, M: 14, L: 28, XL: 52}
  per_integration: 25000
  validation: {S: 10000, M: 20000, L: 40000, XL: 60000}
  hitl_hourly: 38
  token_price_per_m: {api: 4.00, finetune: 1.00, slm: 0.10}
  ml_per_prediction: 0.0005
  option_build_mult: {vendor: 0.30, build_rules: 0.80, build_rpa: 0.90, build_ml: 1.20, api: 1.00, finetune: 1.15, slm: 1.10}
  maintenance_pct: {vendor: 0.05, build_rules: 0.25, build_rpa: 0.25, build_ml: 0.15, api: 0.15, finetune: 0.18, slm: 0.20}
  finetune_fixed: 60000
  finetune_annual_retune: 25000
  ml_retrain_pct: 0.15          # of build, per year, for classical ML
  vendor_switching_pct: 0.50    # of one year's vendor fees, charged once in year-3 TCO (exit priced in)
  payer: {n_payers: 10, edi_enrollment: 2000, edi_per_txn: 0.03, portal_bot_per_payer_yr: 6000}
  build_cone: [0.8, 1.5]
  run_cone: [0.8, 1.2]
  tco_years: 3
  differentiator_threshold: 0.15

workloads:   # option sets + per-txn defaults by workload type
  rules: {options: [build_rules, vendor], tokens: 0,     hitl_share: 0.02, hitl_min: 3}
  rpa:   {options: [build_rpa, vendor],   tokens: 0,     hitl_share: 0.05, hitl_min: 4}
  ml:    {options: [build_ml, vendor],    tokens: 0,     hitl_share: 0.10, hitl_min: 2}
  idp:   {options: [vendor, api, slm],    tokens: 3000,  hitl_share: 0.20, hitl_min: 2, family: doc_extraction}
  nlp:   {options: [vendor, api, finetune, slm], tokens: 2500, hitl_share: 0.30, hitl_min: 3, family: clinical_nlp}
  llm:   {options: [vendor, api, finetune, slm], tokens: 9000, hitl_share: 1.00, hitl_min: 8, family: gen_drafting}
  conv:  {options: [vendor, api],         tokens: 16000, hitl_share: 0.15, hitl_min: 6}

slm_families:   # domain-adapted small models: family-level assets shared across member UCs
  doc_extraction: {adapt_cost: 300000, hosting_yr: 80000}
  clinical_nlp:   {adapt_cost: 350000, hosting_yr: 80000}
  gen_drafting:   {adapt_cost: 400000, hosting_yr: 100000}

platform_assets:  # L1 shared assets: build one-time, run annual; dependents by workload tag or flag
  data_foundation:      {build: 350000, run_yr: 120000, tags: [ml, idp, nlp, llm, conv]}
  label_pipeline:       {build: 150000, run_yr: 60000,  tags: [ml]}
  orchestration_fabric: {build: 300000, run_yr: 100000, tags: [agentic, rpa]}
  observability:        {build: 200000, run_yr: 80000,  tags: [ml, idp, nlp, llm, conv, rpa]}
  doc_ai_platform:      {build: 180000, run_yr: 90000,  tags: [idp]}
  payer_knowledge_base: {build: 120000, run_yr: 60000,  tags: [kb]}
  review_workbenches:   {build: 100000, run_yr: 40000,  tags: [idp, nlp, llm, ml]}
  nonhuman_identity:    {build: 80000,  run_yr: 30000,  tags: [rpa, agentic]}
  prompt_registry:      {build: 60000,  run_yr: 25000,  tags: [llm, nlp, conv, idp]}
  governance_program:   {build: 150000, run_yr: 150000, tags: [ml, idp, nlp, llm, conv, rpa, rules]}

volumes:   # annual volume drivers; claims derives from NPR, the rest chain from it
  claims:             {npr_per_unit: 850}
  encounters:         {of: claims, mult: 0.75}
  orders:             {of: claims, mult: 0.50}
  eligibility_checks: {of: claims, mult: 2.20}
  auth_requests:      {of: claims, mult: 0.08}
  denials:            {of: claims, mult: 0.10}
  appeals:            {of: denials, mult: 0.25}
  variance_cases:     {of: claims, mult: 0.04}
  charge_lines:       {of: claims, mult: 9.0}
  coding_cases:       {of: encounters, mult: 0.70}
  cdi_reviews:        {of: encounters, mult: 0.06}
  queries:            {of: cdi_reviews, mult: 0.35}
  claim_edits:        {of: claims, mult: 0.22}
  rejections:         {of: claims, mult: 0.04}
  remits:             {of: claims, mult: 1.05}
  paper_eobs:         {of: remits, mult: 0.12}
  posting_exceptions: {of: remits, mult: 0.08}
  status_checks:      {of: claims, mult: 0.45}
  statements:         {of: claims, mult: 1.30}
  patient_contacts:   {of: claims, mult: 0.30}
  credit_balances:    {of: claims, mult: 0.015}
  payment_plans:      {of: claims, mult: 0.02}
  audit_requests:     {of: claims, mult: 0.002}
  registrations:      {of: claims, mult: 0.80}
  estimates:          {of: claims, mult: 0.35}
  schedules:          {of: claims, mult: 0.60}
  device_cases:       {of: claims, mult: 0.01}
  cdm_changes:        {flat: 3000}
  contracts:          {flat: 60}
  bulletins:          {flat: 2400}
  providers:          {flat: 800}
  mrf_publications:   {flat: 12}
  monitor_streams:    {flat: 500}

