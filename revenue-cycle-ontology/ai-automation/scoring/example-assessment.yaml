# Example: a plausible mid-maturity regional health system.
# Solid EDI/EHR basics, partial standardization, no AI governance stack yet.
# Run:  python3 score.py example-assessment.yaml

org:
  name: "Example Regional Health (fictional)"
  assessed_by: "RCM automation working group"
  date: "2026-07-03"

dimensions:
  data: 3          # warehouse + linked feeds; labels thin
  integration: 3   # write-back via EHR APIs; no orchestration fabric
  connectivity: 2  # RTE + ERA solid; portals/attachments mixed
  workflow: 2      # queues standardized; exception paths informal
  org: 2           # owners named; HITL capacity partially sized
  governance: 1    # governance body forming; no logging/monitoring stack
  economics: 2     # baselines measured; ROI models exist
  legal: 1         # BAAs solid; ToS/consent reviews ad hoc

facets:
  # ---- data ----
  orders_digitized: 2
  mspq_structured: 2
  auth_structured: 1        # auth numbers structured; CPTs/units often in comments
  denial_labels: 1          # denial codes captured; defect-owner attribution missing
  appeal_outcomes: 0        # outcomes live in appeal letters, not fields
  touch_logging: 1
  clinical_structured: 2
  notes_access: 1           # corpus exists; access approval in progress
  charge_linkage: 1
  supply_chain_feed: 1
  acks_retained: 2
  lockbox_imaging: 2
  bank_feeds: 2
  takeback_linkage: 1
